<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>

  <style>
    /* =====================
       PAGE LAYOUT & FONTS
    ===================== */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* Main card that holds everything */
    .game-container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    /* =====================
       TITLE
    ===================== */
    h1 {
      font-size: 2.4rem;
      margin: 0 0 8px 0;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #e94560, #0f3460, #533483);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: brightness(2);      /* make gradient pop on dark bg */
    }

    /* =====================
       STATUS MESSAGE
       (whose turn / who won)
    ===================== */
    #status {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 12px 0 28px;
      min-height: 2rem;
      transition: color 0.3s;
    }

    /* Color the X and O in the status text */
    #status .x  { color: #ff6b9d; }
    #status .o  { color: #4ecdc4; }

    /* Win message gets a special glow */
    #status.win { animation: pulse 0.6s ease-in-out infinite alternate; }

    @keyframes pulse {
      from { text-shadow: 0 0 6px currentColor; }
      to   { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
    }

    /* =====================
       THE 3×3 BOARD
    ===================== */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows:    repeat(3, 110px);
      gap: 12px;
      margin: 0 auto 32px;
    }

    /* Each individual square */
    .cell {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
      user-select: none;         /* prevent text highlighting on click */
    }

    /* Hover glow — only on empty cells */
    .cell:hover:not(.taken) {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    /* Once a cell has a mark, don't let it be clicked again */
    .cell.taken { cursor: default; }

    /* X is pink/red */
    .cell.x { color: #ff6b9d; }

    /* O is teal */
    .cell.o { color: #4ecdc4; }

    /* Winning squares light up with a bright background */
    .cell.winner {
      background: rgba(255, 215, 0, 0.25);
      border-color: gold;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: bounce 0.5s ease-in-out;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* =====================
       RESTART BUTTON
    ===================== */
    #restart-btn {
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(90deg, #e94560, #533483);
      color: white;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    #restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }

    #restart-btn:active { transform: translateY(0); }
  </style>
</head>

<body>
  <div class="game-container">
    <h1>Tic-Tac-Toe</h1>

    <!-- Shows whose turn it is, or the winner -->
    <div id="status"></div>

    <!-- 9 cells, numbered 0–8 left-to-right, top-to-bottom -->
    <div id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button id="restart-btn">Restart</button>
  </div>

  <script>
    // =====================
    //  GAME STATE
    // =====================

    // All 8 ways to win: rows, columns, and diagonals
    const WIN_COMBOS = [
      [0, 1, 2], // top row
      [3, 4, 5], // middle row
      [6, 7, 8], // bottom row
      [0, 3, 6], // left column
      [1, 4, 7], // middle column
      [2, 5, 8], // right column
      [0, 4, 8], // diagonal top-left → bottom-right
      [2, 4, 6], // diagonal top-right → bottom-left
    ];

    let board;        // array of 9 values: null, 'x', or 'o'
    let currentPlayer; // 'x' or 'o'
    let gameOver;      // true once someone wins or it's a draw

    // =====================
    //  DOM REFERENCES
    // =====================
    const cells      = document.querySelectorAll('.cell');
    const statusEl   = document.getElementById('status');
    const restartBtn = document.getElementById('restart-btn');

    // =====================
    //  INITIALISE / RESET
    // =====================
    function initGame() {
      board         = Array(9).fill(null);
      currentPlayer = 'x';       // X always goes first
      gameOver      = false;

      // Clear every cell visually
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className   = 'cell';   // remove x / o / taken / winner classes
      });

      statusEl.className = '';
      updateStatus();
    }

    // =====================
    //  STATUS TEXT
    // =====================
    function updateStatus(message) {
      if (message) {
        // Custom message (win / draw) passed in directly
        statusEl.innerHTML = message;
      } else {
        // Normal turn indicator
        const mark = currentPlayer.toUpperCase();
        statusEl.innerHTML =
          `Player <span class="${currentPlayer}">${mark}</span>'s turn`;
      }
    }

    // =====================
    //  HANDLE A CELL CLICK
    // =====================
    function handleClick(event) {
      const cell  = event.target;
      const index = parseInt(cell.dataset.index);

      // Ignore clicks on filled cells or after the game ends
      if (gameOver || board[index] !== null) return;

      // Place the current player's mark
      board[index] = currentPlayer;
      cell.textContent = currentPlayer.toUpperCase();
      cell.classList.add('cell', 'taken', currentPlayer);

      // Check if this move won the game
      const winningCombo = getWinningCombo();
      if (winningCombo) {
        highlightWinners(winningCombo);
        const mark = currentPlayer.toUpperCase();
        statusEl.className = 'win';
        updateStatus(
          `Player <span class="${currentPlayer}">${mark}</span> wins! 🎉`
        );
        gameOver = true;
        return;
      }

      // Check for a draw (all 9 squares filled, no winner)
      if (board.every(cell => cell !== null)) {
        updateStatus("It's a draw! 🤝");
        gameOver = true;
        return;
      }

      // Switch to the other player
      currentPlayer = currentPlayer === 'x' ? 'o' : 'x';
      updateStatus();
    }

    // =====================
    //  CHECK FOR A WIN
    //  Returns the winning [a,b,c] combo, or null
    // =====================
    function getWinningCombo() {
      for (const combo of WIN_COMBOS) {
        const [a, b, c] = combo;
        if (
          board[a] !== null &&
          board[a] === board[b] &&
          board[b] === board[c]
        ) {
          return combo;   // found a winner!
        }
      }
      return null;        // no winner yet
    }

    // =====================
    //  HIGHLIGHT WINNING SQUARES
    // =====================
    function highlightWinners(combo) {
      combo.forEach(index => {
        cells[index].classList.add('winner');
      });
    }

    // =====================
    //  EVENT LISTENERS
    // =====================

    // Attach a click handler to every cell
    cells.forEach(cell => cell.addEventListener('click', handleClick));

    // Restart button resets everything
    restartBtn.addEventListener('click', initGame);

    // =====================
    //  START THE GAME
    // =====================
    initGame();
  </script>
</body>
</html>
